<!doctype html>
<html lang="id">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>Little Things — Made with Forge</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f5f1e9;
      color: #283d35;
      font: 15px system-ui;
    }
    nav {
      display: flex;
      justify-content: space-between;
      padding: 28px 8%;
      border-bottom: 1px solid #d7d9cf;
    }
    main {
      max-width: 700px;
      padding: 65px 8%;
      margin: auto;
    }
    .tag {
      font-size: 10px;
      letter-spacing: 3px;
      color: #798b6d;
    }
    h1 {
      font: normal 55px Georgia;
      line-height: 1.08;
      letter-spacing: -2px;
      margin: 22px 0;
    }
    p {
      color: #7a8277;
      line-height: 1.8;
    }
    .card {
      background: #fffdf8;
      padding: 24px;
      border: 1px solid #e0e2d5;
      border-radius: 16px;
      margin-top: 35px;
    }
    .row {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #ededdf;
    }
    input {
      accent-color: #52744b;
      width: 18px;
      height: 18px;
    }
    input:checked + span {
      text-decoration: line-through;
      color: #929789;
    }
    footer {
      margin-top: 30px;
      font-size: 11px;
      color: #8a9589;
    }
    button {
      background: #314b3b;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
    }
    form {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    form input {
      flex: 1;
      width: auto;
      height: auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
  <nav><b>✳ little things</b><small>A little space for your day</small></nav>
  <main>
    <div class="tag">LESS NOISE. MORE INTENTION.</div>
    <h1>Make room for<br />the little things.</h1>
    <p>
      Satu langkah kecil hari ini.<br />Tempat sederhana untuk hal yang berarti.
    </p>
    <div class="card">
      <b>Today's intentions</b>
      <div id="tasks"></div>
      <form>
        <input
          aria-label="Intensi baru"
          placeholder="Tambahkan langkah kecil…"
          required
        /><button>＋</button>
      </form>
    </div>
    <footer>YOUR FIRST APP · MADE WITH FORGE</footer>
  </main>
  <script>
    const items = JSON.parse(
      localStorage.getItem("intentions") ||
        '[{"text":"Mulai sesuatu yang baru","done":true},{"text":"Luangkan waktu untuk ide sendiri","done":false},{"text":"Rayakan kemajuan kecil","done":false}]',
    );
    function render() {
      const tasks = document.querySelector("#tasks");
      tasks.replaceChildren();
      items.forEach((item, i) => {
        const row = document.createElement("label");
        row.className = "row";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = item.done;
        cb.onchange = () => {
          items[i].done = cb.checked;
          save();
        };
        const text = document.createElement("span");
        text.textContent = item.text;
        row.append(cb, text);
        tasks.append(row);
      });
    }
    function save() {
      localStorage.setItem("intentions", JSON.stringify(items));
      render();
    }
    document.querySelector("form").onsubmit = (e) => {
      e.preventDefault();
      const input = e.target.querySelector("input");
      items.push({ text: input.value, done: false });
      input.value = "";
      save();
    };
    render();
  </script>
</html>
